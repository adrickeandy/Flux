name: flux
description: FLUX — Messaging Reimagined
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # Firebase
  firebase_core: ^3.0.0
  firebase_auth: ^5.0.0
  cloud_firestore: ^5.0.0
  firebase_storage: ^12.0.0
  firebase_ai: ^2.0.0

  # State & routing
  provider: ^6.1.0
  go_router: ^14.0.0

  # UI & media
  cached_network_image: ^3.3.0
  image_picker: ^1.0.0
  photo_view: ^0.15.0
  emoji_picker_flutter: ^2.0.0
  flutter_sound: ^9.0.0
  permission_handler: ^11.0.0
  shimmer: ^3.0.0
  flutter_animate: ^4.0.0
  google_fonts: ^6.0.0
  file_picker: ^8.0.0
  url_launcher: ^6.2.0
  shared_preferences: ^2.2.0
  uuid: ^4.0.0
  http: ^1.2.0
  intl: ^0.19.0
  path_provider: ^2.1.0
  cupertino_icons: ^1.0.0
  cloudinary_public: ^0.23.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true